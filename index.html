```html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JANコード読み取りテスト</title>

  <script src="https://unpkg.com/@zxing/browser@latest"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }

    button {
      font-size: 18px;
      padding: 14px 25px;
      margin: 15px 0;
    }

    video {
      width: 100%;
      max-width: 500px;
      background: #000;
    }

    #result {
      font-size: 22px;
      font-weight: bold;
      margin-top: 20px;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h1>JANコード読み取りテスト</h1>

  <p id="status">ZXingを確認しています…</p>

  <button id="startButton">カメラを起動</button>

  <br>

  <video id="video" autoplay muted playsinline></video>

  <div id="result"></div>

  <script>
    window.addEventListener("load", function() {

      const status = document.getElementById("status");
      const startButton = document.getElementById("startButton");
      const video = document.getElementById("video");
      const result = document.getElementById("result");

      if (typeof ZXingBrowser === "undefined") {
        status.textContent = "ZXingの読み込み失敗";
        startButton.disabled = true;
        return;
      }

      status.textContent = "ZXingの読み込み成功";

      startButton.addEventListener("click", async function() {

        status.textContent = "カメラを起動しています…";
        result.textContent = "";

        try {

          const codeReader = new ZXingBrowser.BrowserMultiFormatReader();

          const devices =
            await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();

          if (!devices || devices.length === 0) {
            status.textContent = "カメラが見つかりません";
            return;
          }

          let selectedDeviceId = devices[0].deviceId;

          // 背面カメラを優先
          const backCamera = devices.find(device =>
            /back|rear|environment|背面/i.test(device.label)
          );

          if (backCamera) {
            selectedDeviceId = backCamera.deviceId;
          }

          status.textContent = "カメラ起動中…";

          codeReader.decodeFromVideoDevice(
            selectedDeviceId,
            video,
            (resultData, error) => {

              if (resultData) {

                const code = resultData.getText();

                result.textContent =
                  "読み取り成功： " + code;

                status.textContent =
                  "JANコードを読み取りました";

              }

            }
          );

        } catch (error) {

          console.error(error);

          status.textContent =
            "カメラ起動エラー：" + error.message;

        }

      });

    });
  </script>

</body>
</html>
```
