<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JANコードスキャナー</title>

  <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f7f7f7;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 15px;
    }

    video {
      width: 100%;
      max-width: 500px;
      background: #000;
      border-radius: 12px;
    }

    button {
      width: 100%;
      max-width: 500px;
      padding: 16px;
      margin: 15px 0;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
    }

    #status {
      margin: 12px 0;
      color: #555;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>JANコードスキャナー</h1>

  <video id="video" autoplay playsinline></video>

  <button id="startButton">カメラを起動</button>

  <div id="status">「カメラを起動」を押してください</div>

  <div id="result">
    読み取ったJANコード<br>
    <span id="jan">まだ読み取っていません</span>
  </div>

  <script>

    const video = document.getElementById("video");
    const startButton = document.getElementById("startButton");
    const status = document.getElementById("status");
    const jan = document.getElementById("jan");

    let stream = null;
    let reader = null;
    let controls = null;

    startButton.addEventListener("click", async function() {

      try {

        status.textContent = "カメラを起動しています…";

        // iPhoneの背面カメラを起動
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              ideal: "environment"
            }
          },
          audio: false
        });

        video.srcObject = stream;

        await video.play();

        status.textContent = "バーコードをカメラにかざしてください";

        // JANコード読み取り開始
        reader = new ZXingBrowser.BrowserMultiFormatReader();

        controls = await reader.decodeFromVideoElement(
          video,
          function(result, error) {

            if (result) {

              const code = result.getText();

              // JAN-8 / JAN-13を判定
              if (/^\d{8}$/.test(code) || /^\d{13}$/.test(code)) {

                jan.textContent = code;
                status.textContent = "JANコードを読み取りました！";

                // カメラ停止
                if (stream) {
                  stream.getTracks().forEach(function(track) {
                    track.stop();
                  });
                }

                if (controls) {
                  controls.stop();
                }
              }
            }
          }
        );

      } catch (error) {

        console.error(error);

        status.textContent =
          "エラー：" + error.name;

      }

    });

  </script>

</body>
</html>
