<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JANコード読み取り</title>

  <script src="https://unpkg.com/@zxing/browser@latest"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
      background: #fff;
    }

    h1 {
      font-size: 24px;
    }

    button {
      font-size: 18px;
      padding: 14px 25px;
      margin: 15px 0;
      border-radius: 10px;
      border: none;
      background: #222;
      color: #fff;
    }

    video {
      width: 100%;
      max-width: 500px;
      background: #000;
      margin-top: 10px;
    }

    #result {
      font-size: 22px;
      font-weight: bold;
      margin-top: 20px;
      word-break: break-all;
    }

    #returnMessage {
      margin-top: 15px;
      font-size: 18px;
    }

    #returnButton {
      display: inline-block;
      font-size: 20px;
      padding: 16px 28px;
      border-radius: 10px;
      background: #222;
      color: #fff;
      text-decoration: none;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>📷 JANコード読み取り</h1>

  <p id="status">準備しています…</p>

  <button id="startButton">カメラを起動</button>

  <br>

  <video id="video" autoplay muted playsinline></video>

  <div id="result"></div>

  <div id="returnMessage"></div>

  <script>
    window.addEventListener("load", function() {

      const status = document.getElementById("status");
      const startButton = document.getElementById("startButton");
      const video = document.getElementById("video");
      const result = document.getElementById("result");
      const returnMessage = document.getElementById("returnMessage");

      // ZXing確認
      if (typeof ZXingBrowser === "undefined") {
        status.textContent = "ZXingの読み込み失敗";
        startButton.disabled = true;
        return;
      }

      status.textContent = "ZXingの読み込み成功";


      // カメラ起動
      startButton.addEventListener("click", async function() {

        status.textContent = "カメラを起動しています…";
        result.textContent = "";
        returnMessage.textContent = "";

        try {

          const codeReader =
            new ZXingBrowser.BrowserMultiFormatReader();

          const devices =
            await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();

          if (!devices || devices.length === 0) {
            status.textContent = "カメラが見つかりません";
            return;
          }

          // 最初のカメラを選択
          let selectedDeviceId = devices[0].deviceId;

          // 背面カメラを優先
          const backCamera = devices.find(device =>
            /back|rear|environment|背面/i.test(device.label)
          );

          if (backCamera) {
            selectedDeviceId = backCamera.deviceId;
          }

          status.textContent = "カメラ起動中…";


          // JANコード読み取り
          codeReader.decodeFromVideoDevice(
            selectedDeviceId,
            video,
            (resultData, error) => {

              if (resultData) {

                const code = resultData.getText();

                status.textContent =
                  "JANコードを読み取りました";


                // Google Apps Script 在庫管理画面
                const inventoryUrl =
                  "https://script.google.com/macros/s/AKfycbxx_1G5PTs6-jjCBzA24YGer88fTbjv30Er2veuj5MuUFxvct61DsIzkk1vPdlkRAXL3A/exec";


                // JANコードを付けて戻る
                const returnUrl =
                  inventoryUrl +
                  "?jan=" +
                  encodeURIComponent(code);


                // 結果表示
                result.innerHTML =
                  "読み取り成功： " + code +
                  '<br><br>' +
                  '<a id="returnButton" href="' +
                  returnUrl +
                  '">在庫管理画面へ戻る</a>';


                // カメラ停止
                try {
                  codeReader.reset();
                } catch (e) {
                  console.log("カメラ停止処理をスキップしました");
                }


                // カメラのストリーム停止
                if (video.srcObject) {
                  video.srcObject
                    .getTracks()
                    .forEach(track => {
                      track.stop();
                    });

                  video.srcObject = null;
                }


                // カメラ起動ボタンを無効化
                startButton.disabled = true;
              }

            }
          );

        } catch (error) {

          console.error(error);

          status.textContent =
            "カメラ起動エラー：" + error.message;

        }

      });

    });
  </script>

</body>
</html>
