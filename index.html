<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カメラテスト</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      background: #f7f7f7;
    }

    h1 {
      font-size: 24px;
    }

    video {
      width: 100%;
      max-width: 500px;
      background: #000;
      border-radius: 12px;
    }

    button {
      width: 100%;
      max-width: 500px;
      padding: 16px;
      margin: 20px 0;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: #fff;
    }

    #status {
      margin-top: 15px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <h1>カメラテスト</h1>

  <video id="video" autoplay playsinline></video>

  <button onclick="startCamera()">カメラを起動</button>

  <div id="status">ボタンを押してください</div>

  <script>
    async function startCamera() {

      const status = document.getElementById("status");
      const video = document.getElementById("video");

      try {

        status.textContent = "カメラを起動しています…";

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              ideal: "environment"
            }
          },
          audio: false
        });

        video.srcObject = stream;

        status.textContent = "カメラが起動しました";

      } catch (error) {

        console.error(error);

        status.textContent =
          "カメラを起動できませんでした：" + error.name;
      }
    }
  </script>

</body>
</html>
