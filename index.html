<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JANコードスキャナー</title>

  <script src="https://unpkg.com/@zxing/browser@latest"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f7f7f7;
      color: #222;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin: 10px 0 8px;
    }

    .description {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    #video {
      width: 100%;
      max-width: 500px;
      background: #000;
      border-radius: 12px;
    }

    button {
      margin-top: 18px;
      padding: 14px 28px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
    }

    #status {
      margin: 15px auto;
      max-width: 500px;
      font-size: 14px;
      color: #666;
    }

    #result {
      margin: 20px auto;
      padding: 18px;
      max-width: 500px;
      background: white;
      border-radius: 12px;
    }

    .label {
      font-size: 13px;
      color: #777;
      margin-bottom: 8px;
    }

    #jan {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1px;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h1>JANコードスキャナー</h1>

  <div class="description">
    商品のJANコードをカメラに向けてください
  </div>

  <video id="video" playsinline></video>

  <div>
    <button id="startButton">カメラを起動</button>
  </div>

  <div id="status">
    カメラを起動してください
  </div>

  <div id="result">
    <div class="label">読み取ったJANコード</div>
    <div id="jan">まだ読み取っていません</div>
  </div>

  <script>
    let controls = null;

    const video = document.getElementById("video");
    const startButton = document.getElementById("startButton");
    const status = document.getElementById("status");
    const jan = document.getElementById("jan");

    startButton.addEventListener("click", async () => {

      try {
        status.textContent = "カメラを起動しています…";

        const hints = new Map();

        const formats = [
          ZXingBrowser.BarcodeFormat.EAN_13,
          ZXingBrowser.BarcodeFormat.EAN_8
        ];

        hints.set(
          ZXingBrowser.DecodeHintType.POSSIBLE_FORMATS,
          formats
        );

        const reader =
          new ZXingBrowser.BrowserMultiFormatReader(hints);

        const devices =
          await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();

        if (!devices.length) {
          throw new Error("カメラが見つかりませんでした。");
        }

        // iPhoneでは背面カメラを優先
        let selectedDevice = devices[devices.length - 1];

        for (const device of devices) {
          const label = device.label || "";

          if (
            label.toLowerCase().includes("back") ||
            label.includes("背面") ||
            label.toLowerCase().includes("environment")
          ) {
            selectedDevice = device;
            break;
          }
        }

        status.textContent =
          "バーコードを画面中央に合わせてください";

        controls = await reader.decodeFromVideoDevice(
          selectedDevice.deviceId,
          video,
          (result, error) => {

            if (result) {

              const code = result.getText();

              // JANとして13桁または8桁だけを採用
              if (/^\d{13}$/.test(code) ||
                  /^\d{8}$/.test(code)) {

                jan.textContent = code;

                status.textContent =
                  "JANコードを読み取りました";

                if (navigator.vibrate) {
                  navigator.vibrate(100);
                }
              }
            }
          }
        );

      } catch (error) {

        console.error(error);

        status.textContent =
          "カメラを起動できませんでした。カメラの許可を確認してください。";
      }
    });
  </script>

</body>
</html>
