<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JANコードスキャナー</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f7f7f7;
      color: #222;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin: 10px 0 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
    }

    #result {
      margin: 20px auto;
      padding: 15px;
      max-width: 500px;
      background: #fff;
      border-radius: 10px;
      font-size: 20px;
      word-break: break-all;
    }

    .label {
      font-size: 14px;
      color: #666;
      margin-bottom: 5px;
    }

    #jan {
      font-size: 28px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>JANコードスキャナー</h1>

  <div id="reader"></div>

  <div id="result">
    <div class="label">読み取ったJANコード</div>
    <div id="jan">まだ読み取っていません</div>
  </div>

  <script>
    function onScanSuccess(decodedText) {
      document.getElementById("jan").textContent = decodedText;
    }

    function onScanFailure(error) {
      // 読み取り中のエラーは表示しません
    }

    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: { width: 280, height: 150 },
        rememberLastUsedCamera: true
      },
      false
    );

    scanner.render(onScanSuccess, onScanFailure);
  </script>

</body>
</html>
