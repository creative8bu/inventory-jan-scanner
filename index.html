<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JANコードスキャナー</title>

  <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f7f7f7;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    #video {
      width: 100%;
      max-width: 500px;
      background: #000;
      border-radius: 12px;
    }

    button {
      width: 100%;
      max-width: 500px;
      padding: 16px;
      margin: 15px 0;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
    }

    #result {
      font-size: 22px;
      font-weight: bold;
      word-break: break-all;
      margin-top: 20px;
    }

    #status {
      margin-top: 10px;
      color: #666;
    }
  </style>
</head>

<body>

  <h1>JANコードスキャナー</h1>

  <video id="video" playsinline></video>

  <button id="startButton">カメラを起動</button>

  <div id="status">カメラを起動してください</div>

  <div id="result">
    読み取ったJANコード<br>
    <span id="jan">まだ読み取っていません</span>
  </div>

  <script>
    const video = document.getElementById("video");
    const startButton = document.getElementById("startButton");
    const status = document.getElementById("status");
    const jan = document.getElementById("jan");

    let reader = null;
    let controls = null;

    startButton.addEventListener("click", async function () {

      try {
        status.textContent = "カメラを起動しています…";

        reader = new ZXingBrowser.BrowserMultiFormatReader();

        controls = await reader.decodeFromConstraints(
          {
            video: {
              facingMode: { ideal: "environment" }
            }
          },
          video,
          function(result, error) {

            if (result) {
              const code = result.getText();

              if (/^\d{8}$|^\d{12,14}$/.test(code)) {
                jan.textContent = code;
                status.textContent = "JANコードを読み取りました";

                if (controls) {
                  controls.stop();
                }
              }
            }
          }
        );

        status.textContent = "JANコードをカメラにかざしてください";

      } catch (error) {

        console.error(error);

        status.textContent =
          "カメラを起動できませんでした。カメラの許可を確認してください。";
      }
    });
  </script>

</body>
</html>
