<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JANコードスキャナー</title>

  <script src="https://unpkg.com/@zxing/browser@latest"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f7f7f7;
    }

    h1 {
      font-size: 24px;
    }

    video {
      width: 100%;
      max-width: 500px;
      background: #000;
      border-radius: 12px;
    }

    button {
      width: 100%;
      max-width: 500px;
      padding: 16px;
      margin: 15px 0;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: #fff;
    }

    #status {
      margin: 12px 0;
      font-size: 16px;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #fff;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>JANコードスキャナー</h1>

  <video id="video" autoplay playsinline></video>

  <button id="startButton">カメラを起動</button>

  <div id="status">
    「カメラを起動」を押してください
  </div>

  <div id="result">
    読み取ったJANコード<br>
    <span id="jan">まだ読み取っていません</span>
  </div>

  <script>

    const video = document.getElementById("video");
    const startButton = document.getElementById("startButton");
    const status = document.getElementById("status");
    const jan = document.getElementById("jan");

    let controls = null;

    startButton.addEventListener("click", async function() {

      try {

        status.textContent = "カメラを起動しています…";

        const reader =
          new ZXingBrowser.BrowserMultiFormatReader();

        controls = await reader.decodeFromConstraints(
          {
            video: {
              facingMode: "environment"
            },
            audio: false
          },
          video,
          function(result, error) {

            if (!result) {
              return;
            }

            const code = result.getText();

            console.log("読み取り結果:", code);

            if (
              /^\d{8}$/.test(code) ||
              /^\d{13}$/.test(code)
            ) {

              jan.textContent = code;

              status.textContent =
                "JANコードを読み取りました！";

              if (controls) {
                controls.stop();
              }
            }

          }
        );

        status.textContent =
          "バーコードをカメラにかざしてください";

      } catch (error) {

        console.error(error);

        status.textContent =
          "エラー：" + error.message;

      }

    });

  </script>

</body>
</html>
