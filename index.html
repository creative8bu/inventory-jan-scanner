<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JANコードスキャナー</title>

  <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f7f7f7;
      color: #222;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin: 10px 0 8px;
    }

    .description {
      font-size: 14px;
      color: #666;
      margin-bottom: 18px;
    }

    #video {
      width: 100%;
      max-width: 500px;
      background: #000;
      border-radius: 12px;
      display: block;
      margin: 0 auto;
    }

    button {
      margin-top: 18px;
      padding: 15px 35px;
      font-size: 18px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: #fff;
    }

    #status {
      margin: 16px 0;
      font-size: 14px;
      color: #666;
    }

    #result {
      margin: 20px auto;
      padding: 18px;
      max-width: 500px;
      background: #fff;
      border-radius: 12px;
    }

    .label {
      font-size: 13px;
      color: #777;
      margin-bottom: 8px;
    }

    #jan {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1px;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h1>JANコードスキャナー</h1>

  <div class="description">
    商品のバーコードをカメラに向けてください
  </div>

  <video id="video" playsinline></video>

  <button id="startButton">
    カメラを起動
  </button>

  <div id="status">
    「カメラを起動」を押してください
  </div>

  <div id="result">
    <div class="label">読み取ったJANコード</div>
    <div id="jan">まだ読み取っていません</div>
  </div>

  <script>
    const video = document.getElementById("video");
    const startButton = document.getElementById("startButton");
    const status = document.getElementById("status");
    const jan = document.getElementById("jan");

    let codeReader = null;
    let scanning = false;

    startButton.addEventListener("click", async function () {

      if (scanning) {
        return;
      }

      try {

        scanning = true;

        status.textContent = "カメラを起動しています…";
        startButton.disabled = true;

        codeReader = new ZXingBrowser.BrowserMultiFormatReader();

        const devices =
          await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();

        if (!devices || devices.length === 0) {
          throw new Error("カメラが見つかりませんでした。");
        }

        // 背面カメラを優先
        let selectedDevice = devices[0];

        for (const device of devices) {

          const label = device.label || "";

          if (
            label.toLowerCase().includes("back") ||
            label.toLowerCase().includes("rear") ||
            label.includes("背面")
          ) {
            selectedDevice = device;
            break;
          }
        }

        status.textContent =
          "バーコードを画面中央に合わせてください";

        await codeReader.decodeFromVideoDevice(
          selectedDevice.deviceId,
          video,
          function (result, error) {

            if (!result) {
              return;
            }

            const value = result.getText();

            // JAN-13 または JAN-8 の数字だけを採用
            if (/^\d{13}$/.test(value) ||
                /^\d{8}$/.test(value)) {

              jan.textContent = value;

              status.textContent =
                "JANコードを読み取りました";

              if (navigator.vibrate) {
                navigator.vibrate(100);
              }
            }
          }
        );

      } catch (error) {

        console.error(error);

        scanning = false;
        startButton.disabled = false;

        status.textContent =
          "カメラを起動できませんでした。";
      }

    });
  </script>

</body>
</html>
